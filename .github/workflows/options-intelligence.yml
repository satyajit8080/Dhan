name: options-intelligence

on:
  push:
    paths: ["options-intelligence/**", ".github/workflows/options-intelligence.yml"]
  pull_request:
    paths: ["options-intelligence/**", ".github/workflows/options-intelligence.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    defaults:
      run:
        working-directory: options-intelligence/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: bandit -q -r doi -ll
      - run: pip-audit
      - run: pytest -q
      - name: migrations apply cleanly and are idempotent
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
        run: |
          psql "$DATABASE_URL" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          python -m doi.db.migrate
          python -m doi.db.migrate | grep "up to date"
