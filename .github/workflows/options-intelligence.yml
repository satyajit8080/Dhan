name: options-intelligence

on:
  push:
    paths: ["options-intelligence/**", ".github/workflows/options-intelligence.yml"]
  pull_request:
    paths: ["options-intelligence/**", ".github/workflows/options-intelligence.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: options-intelligence/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f options-intelligence/migrations/001_init.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: ci
