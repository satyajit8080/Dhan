[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dhan-options-intelligence"
version = "0.1.0"
description = "Paper-only Dhan index-options intelligence backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "PyYAML==6.0.2",
  "psycopg[binary]==3.2.3",
  "websockets==13.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.8.4", "bandit==1.8.0", "pip-audit==2.7.3"]

[tool.setuptools.packages.find]
include = ["doi*"]

[tool.setuptools.package-data]
"doi.intelligence.strategy_configs" = ["*.yaml"]
"doi.core" = ["*.yaml"]
"doi.app" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "DTZ"]
ignore = ["B008", "E731", "RUF001", "RUF005", "RUF009"]

[tool.ruff.lint.pycodestyle]
max-line-length = 170
