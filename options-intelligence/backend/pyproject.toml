[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dhan-options-intelligence"
version = "0.1.0"
description = "Paper-only Dhan index-options intelligence backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[tool.setuptools.packages.find]
include = ["doi*"]

[tool.setuptools.package-data]
"doi.intelligence.strategy_configs" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "DTZ"]
ignore = ["B008", "UP046", "E731", "RUF001", "RUF005"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150
