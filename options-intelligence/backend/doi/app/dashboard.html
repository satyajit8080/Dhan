<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Bull50 Research Desk</title>
<style>
:root{--bg:#06090F;--pn:#0E131C;--pn2:#0A0F17;--ln:#1A2332;--ln2:#243046;--tx:#E8EEF7;--t2:#8B9BB4;--t3:#5A6A84;--am:#FFB300;--amd:rgba(255,179,0,.12);--up:#1FC77E;--dn:#F0444F;--bar:#2B4A72;--bar2:#5B3B6E;
--mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"Inter","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;border-radius:0!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px/1.35 var(--sans);overflow:hidden}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln2);padding:3px 7px}
button{cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:600}
button:hover:not(:disabled){border-color:var(--t2)}button:disabled{opacity:.35;cursor:not-allowed}
button.pri{border-color:var(--am);color:var(--am)}button.dng{border-color:var(--dn);color:var(--dn)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:1px solid var(--am);outline-offset:-1px}
.n,td,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-rows:40px auto 1fr 20px;grid-template-columns:auto 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:stretch;border-bottom:1px solid var(--ln);background:var(--pn2);white-space:nowrap;overflow:hidden}
header>*{display:flex;align-items:center;padding:0 9px;border-right:1px solid var(--ln);gap:6px;flex-shrink:0}
.logo{font:700 14px var(--mono);letter-spacing:.08em}.logo b{color:var(--am)}
.lbl{color:var(--t3);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.tk .n{font-size:12.5px;font-weight:600}
.dot{width:7px;height:7px;display:inline-block;background:var(--t3)}.dot.ok{background:var(--up)}.dot.bad{background:var(--dn)}.dot.ai{background:var(--am)}
.tag{font:600 9.5px var(--mono);letter-spacing:.08em;padding:1px 5px;border:1px solid var(--ln2);color:var(--t2);text-transform:uppercase}
.tag.am{border-color:var(--am);color:var(--am)}.tag.up{border-color:var(--up);color:var(--up)}.tag.dn{border-color:var(--dn);color:var(--dn)}.tag.fill{background:var(--am);color:#000;border-color:var(--am)}
.paper{color:#000;background:var(--t2);font:700 10px var(--mono);letter-spacing:.12em;padding:2px 6px}
.meter{width:80px;height:5px;background:var(--ln);position:relative}.meter>i{position:absolute;left:0;top:0;bottom:0;background:var(--am)}.meter.stop>i{background:var(--dn)}
.sp{flex:1 1 0;min-width:0;border-right:0;padding:0}
header>div:last-of-type{border-right:0}
#h-user{max-width:150px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1750px){.hx{display:none}}
#ks{flex-shrink:0;font:700 10.5px var(--mono);padding:0 14px;border:0;border-left:1px solid var(--ln);background:transparent;letter-spacing:.1em}
#ks.on{background:var(--dn);color:#fff}#ks.off{color:var(--dn)}
#bnr{grid-column:1/3}
.bn{padding:4px 12px;font:600 11px var(--mono);letter-spacing:.04em;border-bottom:1px solid var(--ln)}.bn.dn{background:rgba(240,68,79,.14);color:var(--dn)}.bn.am{background:var(--amd);color:var(--am)}
nav{border-right:1px solid var(--ln);background:var(--pn2);width:208px;overflow-y:auto;display:flex;flex-direction:column}
nav.c{width:44px}nav.c .nl{display:none}
nav a{display:flex;gap:9px;padding:6px 12px;color:var(--t2);text-decoration:none;border-left:2px solid transparent;font-size:11.5px}
nav a .nn{font:600 10.5px var(--mono);color:var(--t3);min-width:18px}
nav a:hover{color:var(--tx);background:var(--pn)}nav a.act{color:var(--tx);background:var(--pn);border-left-color:var(--am)}nav a.act .nn{color:var(--am)}
#rail{border:0;border-bottom:1px solid var(--ln);text-align:left;padding:7px 14px;color:var(--t3);background:transparent}
main{overflow:auto;position:relative}
.sh{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--ln);background:var(--pn2);position:sticky;top:0;z-index:3}
.sh h1{margin:0;font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase}.sh h1 span{color:var(--am);margin-right:8px}
.sh .ctl{margin-left:auto;display:flex;gap:6px;align-items:center}
.g{display:grid;gap:1px;background:var(--ln);border-bottom:1px solid var(--ln)}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.s2{grid-column:span 2}.s3{grid-column:span 3}.sall{grid-column:1/-1}
@media(max-width:1100px){.c3,.c4,.c6{grid-template-columns:repeat(2,minmax(0,1fr))}.s3{grid-column:1/-1}}
@media(max-width:700px){.c2,.c3,.c4,.c6{grid-template-columns:minmax(0,1fr)}.s2,.s3{grid-column:auto}nav{width:44px}nav .nl{display:none}header .hm{display:none}}
.pn{background:var(--pn);min-width:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:8px;padding:5px 9px;border-bottom:1px solid var(--ln);min-height:26px}
.pt{font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase}.ps{color:var(--t3);font:10px var(--mono);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{padding:6px 9px;overflow:auto;flex:1}.pb.tight{padding:0}.pb.tight>.st{padding:10px 9px}
.st{font:600 10.5px var(--mono);letter-spacing:.08em;padding:10px 2px;color:var(--t3)}.st.err{color:var(--dn)}.st.dis{color:var(--t2)}.st.ld::after{content:"";display:inline-block;width:24px;height:2px;margin-left:8px;vertical-align:middle;background:linear-gradient(90deg,var(--am) 30%,transparent 30%);background-size:12px 2px;animation:ld .8s linear infinite}
@keyframes ld{to{background-position:12px 0}}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));border-top:1px solid var(--ln);border-left:1px solid var(--ln)}
.kv>div{padding:5px 7px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln)}.kv .v{font:600 15px var(--mono);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kv .v.sm{font-size:12px}
table{width:100%;border-collapse:collapse}th{font:600 9.5px var(--mono);color:var(--t3);letter-spacing:.06em;text-transform:uppercase;text-align:right;padding:4px 6px;border-bottom:1px solid var(--ln2);position:sticky;top:0;background:var(--pn);z-index:1;white-space:nowrap}
td{padding:2px 6px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap;font-size:11.5px}th.l,td.l{text-align:left}td.w{white-space:normal;font-family:var(--sans);min-width:220px}
tr:hover td{background:rgba(255,255,255,.025)}
.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--am)}.mu{color:var(--t2)}.mu3{color:var(--t3)}
.oc td{padding:1px 5px;font-size:11px}.oc td.k{background:var(--pn2);color:var(--tx);font-weight:700;text-align:center;border-left:1px solid var(--ln2);border-right:1px solid var(--ln2)}
.oc tr.atm td{background:var(--amd)}.oc tr.atm td.k{color:var(--am);background:rgba(255,179,0,.2)}
.oc td.wall{box-shadow:inset 0 -2px 0 var(--am)}
.oc .ob{position:relative}.oc .ob>i{position:absolute;top:2px;bottom:2px;background:var(--bar);opacity:.45}.oc .ce>i{right:0}.oc .pe>i{left:0;background:var(--bar2)}.oc .ob>span{position:relative}
.oc th.ceh{color:#7FA6D6}.oc th.peh{color:#B58BCB}
.ag{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln)}
@media(max-width:900px){.ag{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ag>div{background:var(--pn);padding:5px 7px;min-height:52px;border-top:2px solid transparent}.ag .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ag .x{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.ag>div.hl{border-top-color:var(--am)}.ag>div.dis{background:#141218}
.dec{display:grid;grid-template-columns:200px 1fr;gap:1px;background:var(--ln)}.dec>div{background:var(--pn);padding:8px 10px}
.dl{font:700 20px var(--mono);color:var(--am);letter-spacing:.04em}
.tr{border-bottom:1px solid var(--ln);padding:5px 0;display:grid;grid-template-columns:30px 80px 230px 1fr;gap:8px}.tr .m{font:10.5px var(--mono);color:var(--t3)}
.cl{margin:1px 0}.cl .ev{font:10px var(--mono);color:var(--am);margin-left:6px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:11px/1.45 var(--mono);color:var(--t2)}
.frm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.frm label{display:flex;gap:5px;align-items:center;color:var(--t2);font-size:11px}
textarea{width:100%;min-height:120px;font:11px var(--mono)}
#wm{position:fixed;inset:0;pointer-events:none;display:none;align-items:center;justify-content:center;z-index:2}
#wm span{transform:rotate(-24deg);font:800 56px var(--mono);letter-spacing:.08em;color:rgba(139,155,180,.07);white-space:nowrap}
footer{grid-column:1/3;border-top:1px solid var(--ln);background:var(--pn2);display:flex;gap:14px;align-items:center;padding:0 10px;font:10px var(--mono);color:var(--t3);white-space:nowrap;overflow:hidden}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
#dlg .box{background:var(--pn);border:1px solid var(--ln2);width:min(460px,92vw);padding:0}
#dlg .bb{padding:10px;display:flex;flex-direction:column;gap:8px}#dlg .bf{display:flex;gap:6px;justify-content:flex-end;padding:8px 10px;border-top:1px solid var(--ln)}
#ntf{position:fixed;top:40px;right:120px;width:340px;max-height:60vh;overflow:auto;background:var(--pn);border:1px solid var(--ln2);display:none;z-index:40}
#ntf div{padding:6px 9px;border-bottom:1px solid var(--ln);font-size:11px}
#toast{position:fixed;bottom:28px;right:12px;z-index:60;display:flex;flex-direction:column;gap:4px}
#toast div{background:var(--pn);border:1px solid var(--ln2);border-left:2px solid var(--am);padding:6px 10px;font:11px var(--mono);max-width:420px}
#toast div.e{border-left-color:var(--dn)}
.spark{width:100%;height:150px;display:block}
.hbar{height:4px;background:var(--ln);margin-top:3px}.hbar>i{display:block;height:100%;background:var(--am)}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo">BULL<b>50</b><span class="lbl hx" style="margin-left:6px">Research Desk</span></div>
  <div><span class="lbl">Session</span><span id="h-ses" class="tag">—</span><span id="h-ist" class="n mu hx"></span></div>
  <div class="tk" id="h-NIFTY"><span class="lbl">NIFTY</span><span class="n">—</span><span class="n mu3" title="previous close is not exposed by the API">CHG —</span></div>
  <div class="tk" id="h-BANKNIFTY"><span class="lbl">BANKNIFTY</span><span class="n">—</span><span class="n mu3" title="previous close is not exposed by the API">CHG —</span></div>
  <div class="hm"><span class="lbl">Dhan</span><span id="h-dhan" class="dot"></span><span id="h-dhant" class="n mu">—</span></div>
  <div class="hm"><span class="lbl">Grok</span><span id="h-grok" class="dot"></span><span id="h-grokt" class="n mu">—</span></div>
  <div><span class="paper">PAPER MODE</span></div>
  <div title="Grok spend this month vs hard cap (enforced server-side)"><span class="lbl">AI Budget</span><span id="h-bud" class="n">—</span><span id="h-meter" class="meter"><i style="width:0"></i></span></div>
  <div class="sp"></div>
  <div><button id="h-ntf" title="Notifications">ALERTS <span id="h-ntfn" class="n">0</span></button></div>
  <div><button id="h-user" title="API key and identity">KEY</button></div>
  <button id="ks" class="off" title="Kill switch (admin)">KILL SWITCH —</button>
</header>
<div id="bnr"></div>
<nav id="nav"><button id="rail" title="Collapse navigation">◂ <span class="nl">Collapse</span></button></nav>
<main id="main"></main>
<footer><span>RESEARCH &amp; PAPER ONLY · NO LIVE BROKER EXECUTION · AI CANNOT PLACE ORDERS · HUMAN APPROVAL + RISK GATE REQUIRED</span><span class="sp"></span><span id="f-upd">—</span></footer>
</div>
<div id="wm"><span>PAPER MODE — NO LIVE EXECUTION</span></div>
<div id="ntf"></div>
<div id="dlg"><div class="box"><div class="ph"><span class="pt" id="dlg-t"></span></div><div class="bb" id="dlg-b"></div><div class="bf" id="dlg-f"></div></div></div>
<div id="toast"></div>
<script>
"use strict";
// Security: every API value (including agent text) is untrusted. DOM is built with createElement/textContent only;
// this page never uses innerHTML. The API key lives in sessionStorage for this tab only. No secrets are embedded here.
// All analytics (Greeks, PCR, Max Pain, P&L, risk, committee labels) are computed by the backend; this page only displays.
const $ = (id) => document.getElementById(id);
const SECTIONS = [["01","Command Center"],["02","Market Intelligence"],["03","Options Intelligence"],["04","AI Investment Committee"],["05","AI Agent Control Room"],["06","Strategy Research Lab"],["07","Backtesting"],["08","AI Predictions"],["09","Paper Trading"],["10","Portfolio Analytics"],["11","Agent Leaderboard"],["12","Historical Data & Replay"],["13","Reports & Analytics"],["14","System Monitoring"],["15","Administration"]];
const HARD_CAP = 3000;
let key = sessionStorage.getItem("doi_key") || "";
const S = { status:null, budget:null, budgetErr:null, who:null, recs:[], tick:{}, und:null };

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "text") n.textContent = v; else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== undefined && c !== null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
const svg = (tag, attrs) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, cache: "no-store", headers: { "Content-Type": "application/json", ...(key ? { Authorization: "Bearer " + key } : {}) } });
  const t = await r.text(); let b; try { b = JSON.parse(t); } catch { b = t; }
  if (!r.ok) throw new ApiError(r.status, (b && b.detail ? (typeof b.detail === "string" ? b.detail : JSON.stringify(b.detail)) : String(t)).slice(0, 300));
  return b;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body ?? {}) });

// ---------- formatting (display only)
const nil = (v) => v === null || v === undefined || v === "" || (typeof v === "number" && !isFinite(v));
const num = (v) => nil(v) ? null : Number(v);
function f(v, d = 2) { const x = num(v); return x === null || isNaN(x) ? "—" : x.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d }); }
const inr = (v, d = 2) => nil(v) ? "—" : "₹" + f(v, d);
const pct = (v, d = 2) => nil(v) ? "—" : f(Number(v) * 100, d) + "%";
const int = (v) => f(v, 0);
function big(v) { const x = num(v); if (x === null) return "—"; const a = Math.abs(x); return a >= 1e7 ? f(x / 1e7, 2) + "Cr" : a >= 1e5 ? f(x / 1e5, 2) + "L" : f(x, 0); }
const sgn = (v) => { const x = num(v); return x === null ? "mu" : x > 0 ? "up" : x < 0 ? "dn" : "mu"; };
const pnl = (v) => el("span", { class: sgn(v) }, inr(v));
function ts(v) { if (nil(v)) return "—"; const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleString("en-IN", { timeZone: "Asia/Kolkata", hour12: false, day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
const short = (s, n = 10) => nil(s) ? "—" : String(s).length > n ? String(s).slice(0, n) + "…" : String(s);
const compact = (v) => nil(v) ? "—" : typeof v === "object" ? JSON.stringify(v) : String(v);
const tag = (t, c = "") => el("span", { class: "tag " + c }, t);

// ---------- panels with loading / empty / error / disconnected states
let LIVE = [];
function state(kind, msg) { const cls = { LOADING: "st ld", EMPTY: "st", ERROR: "st err", DISCONNECTED: "st dis", AUTH: "st err" }[kind]; return el("div", { class: cls }, kind + (msg ? " · " + msg : "")); }
function errState(e) {
  if (e instanceof ApiError) {
    if (e.status === 401) return state("AUTH", "API key required — set it with KEY");
    if (e.status === 403) return state("AUTH", "your role cannot view this");
    if (e.status === 503) return state("DISCONNECTED", e.message);
  }
  if (e instanceof TypeError) return state("DISCONNECTED", "backend unreachable");
  return state("ERROR", e.message || String(e));
}
function panel(title, src, load, o = {}) {
  const body = el("div", { class: "pb" + (o.tight ? " tight" : "") }, state("LOADING"));
  const ctl = el("span", { class: "ps" }, src || "");
  const p = el("section", { class: "pn " + (o.cls || "") }, el("div", { class: "ph" }, el("span", { class: "pt" }, title), ...(o.tools || []), ctl), body);
  let busy = false;
  p.refresh = async () => {
    if (busy) return; busy = true;
    try { const out = await load(); body.replaceChildren(out === null || out === undefined || (Array.isArray(out) && !out.length) ? state("EMPTY", o.empty || "no records") : out); }
    catch (e) { body.replaceChildren(errState(e)); }
    finally { busy = false; }
  };
  if (o.live !== false) LIVE.push(p);
  p.refresh();
  return p;
}
function table(rows, cols, o = {}) {
  if (!rows || !rows.length) return null;
  const t = el("table", { class: o.cls });
  t.append(el("thead", {}, el("tr", {}, cols.map((c) => el("th", { class: c.l ? "l" : "" }, c.h)))));
  const tb = el("tbody");
  for (const r of rows) tb.append(el("tr", { class: o.rowCls ? o.rowCls(r) : "" }, cols.map((c) => { const v = typeof c.v === "function" ? c.v(r) : r[c.v]; return el("td", { class: (c.l ? "l " : "") + (c.w ? "w " : "") + (c.c ? c.c(r) : "") }, v instanceof Node ? v : (nil(v) ? "—" : v)); })));
  t.append(tb);
  return t;
}
function autoTable(rows, skip = []) {
  if (!rows || !rows.length) return null;
  const keys = [...new Set(rows.flatMap((r) => Object.keys(r)))].filter((k) => !skip.includes(k));
  return table(rows, keys.map((k) => ({ h: k.replace(/_/g, " "), v: (r) => compact(r[k]), l: true })));
}
const kv = (pairs) => el("div", { class: "kv" }, pairs.filter(Boolean).map(([k, v, cls]) => el("div", {}, el("div", { class: "lbl" }, k), el("div", { class: "v " + (cls || "") }, v instanceof Node ? v : (nil(v) ? "—" : v)))));
const grid = (cls, ...kids) => el("div", { class: "g " + cls }, ...kids);
function toast(msg, err) { const d = el("div", { class: err ? "e" : "" }, msg); $("toast").append(d); setTimeout(() => d.remove(), 6000); }
function dialog(title, fields, actions) {
  $("dlg-t").textContent = title; $("dlg-b").replaceChildren(...fields.filter(Boolean)); $("dlg-f").replaceChildren(...actions, el("button", { onclick: closeDlg }, "Cancel")); $("dlg").style.display = "flex";
}
const closeDlg = () => { $("dlg").style.display = "none"; };
async function act(fn, ok) { try { const r = await fn(); toast(ok || "done"); refreshAll(); return r; } catch (e) { toast((e.status ? e.status + " · " : "") + e.message, true); } }

// ---------- global shell state
const aiStop = () => { const b = S.budget; if (!b) return true; return b.frozen || Number(b.spent_inr) >= Number(b.hard_limit_inr || HARD_CAP) || Number(b.spent_inr) + Number(b.reserved_inr) >= Number(b.usable_inr) || b.utilisation >= ((b.routing || {}).stop_at ?? 0.97); };
const killOn = () => !!(S.status && S.status.kill_switch);
const pending = () => S.recs.filter((r) => r.status === "PENDING_HUMAN");
function alerts() {
  const a = [], s = S.status;
  if (!key) a.push(["AUTH", "No API key set for this tab"]);
  if (!s) return a;
  if (s.kill_switch) a.push(["KILL", "Kill switch engaged — chain polling and new orders stopped"]);
  const tk = (s.market_data || {}).token; if (tk && tk.state !== "VALID") a.push(["DHAN", "Dhan token state: " + tk.state]);
  if (!(s.market_data || {}).provider_configured) a.push(["DHAN", "Market data provider not configured"]);
  const rec = (s.market_data || {}).recorder || {}; if (rec.failures) a.push(["DATA", rec.failures + " recorder write failures"]);
