services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: doi
      POSTGRES_USER: doi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      SECRETS_DIR: /run/doi-secrets
      DHAN_TOKEN_FILE: /run/doi-secrets/dhan.token
    volumes:
      - ./secrets:/run/doi-secrets  # writable: the Settings page saves keys here (0600)
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [db, redis]

  # Phase 7 AI research worker: separate process, reads recorded data from PostgreSQL,
  # never calls Dhan and never submits paper orders (humans approve via the API).
  ai-worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["python", "-m", "doi.ai.worker"]
    env_file: .env
    environment:
      SECRETS_DIR: /run/doi-secrets
    volumes:
      - ./secrets:/run/doi-secrets:ro  # reads the Grok key saved from the Settings page
    depends_on: [db, api]
    restart: unless-stopped

volumes:
  dbdata:
